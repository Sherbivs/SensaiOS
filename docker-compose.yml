  # Data Pipeline Worker
  # DISABLED FOR LOCAL DEVELOPMENT - Workers run inside main bot process
  # data-pipeline:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: infinity-gauntlet-data-pipeline
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
  #     PROD_DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
  #     NODE_ENV: development
  #     SERVICE_NAME: data-pipeline-worker
  #     LOG_FORMAT: json
  #     LOG_BUFFER_ENABLED: "true"
  #     DATA_PIPELINE_INTERVAL_MS: "86400000"
  #     DATA_PIPELINE_INTERVAL_JITTER_MS: "900000"
  #     DATA_PIPELINE_RUN_ON_BOOT: "false"
  #     TZ: America/New_York
