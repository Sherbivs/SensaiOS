# ==========================================
# Pokémon Infinity Gauntlet - Docker Compose
# ==========================================
# Local development environment with PostgreSQL + Discord bot + Workers
# Architecture: Multi-container setup mirroring Render production

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: infinity-gauntlet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinity_gauntlet
      POSTGRES_USER: gauntlet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauntlet -d infinity_gauntlet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-gauntlet

  # Main Discord Bot Worker
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinity-gauntlet-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
      PROD_DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
      
      # Discord credentials (set in .env file)
      BOT_TOKEN: ${BOT_TOKEN}
      POKEMON_BOT_TOKEN: ${POKEMON_BOT_TOKEN}
      SECURITY_BOT_TOKEN: ${SECURITY_BOT_TOKEN}
      
      # Service configuration
      NODE_ENV: development
      SERVICE_NAME: discord-bot
      LOG_FORMAT: cli
      LOG_BUFFER_ENABLED: "true"
      LOG_BUFFER_INTERVAL: "10000"
      LOG_BUFFER_BYPASS_CRITICAL: "true"
      
      # Health check
      HEALTH_CHECK_PORT: 3000
      HEALTH_CHECK_HOST: 0.0.0.0
      
      # Feature flags
      ENABLE_POKEMON_BOT: "true"
      ENABLE_SECURITY_BOT: "false"
      ENABLE_DB_AUTO_SYNC: "false"
      
      # Battle configuration
      BATTLE_CHANNEL_NAME: pokemon-battles
      DISABLE_SNAPSHOT_PRECHECK: "true"
      
      # Timezone
      TZ: America/New_York
    ports:
      - "3000:3000"
    volumes:
      - bot_store:/app/Store
      - ./data:/app/data:ro
      - ./assets:/app/assets:ro
    networks:
      - infinity-gauntlet
    command: ["node", "dist/index.js"]

  # Outbox Worker (Async message delivery)
