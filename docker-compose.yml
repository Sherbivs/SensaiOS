  #     - pipeline_store:/app/Store
  #   networks:
  #     - infinity-gauntlet
  #   command: ["node", "dist/worker/data-pipeline.js"]

  # Security Bot (Optional - enable via environment)
  security:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinity-gauntlet-security
    restart: unless-stopped
    profiles:
      - security
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECURITY_BOT_TOKEN: ${SECURITY_BOT_TOKEN}
      NODE_ENV: development
      SERVICE_NAME: security-bot
      LOG_FORMAT: json
      LOG_BUFFER_ENABLED: "true"
      ENABLE_SECURITY_BOT: "true"
      ENABLE_CONTINUOUS_SWEEP: "true"
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_CHANNEL_ID: ${ALERT_CHANNEL_ID:-}
      ALERT_USER_ID: ${ALERT_USER_ID:-}
      ROLE_NAME: Trainer
      DISABLE_SNAPSHOT_PRECHECK: "true"
      TZ: America/New_York
    volumes:
      - security_store:/app/Store
    networks:
      - infinity-gauntlet
    command: ["npx", "tsx", "security-bot.ts"]

networks:
  infinity-gauntlet:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  bot_store:
    driver: local
  outbox_store:
    driver: local
  cache_store:
    driver: local
  pipeline_store:
    driver: local
  security_store:
    driver: local
