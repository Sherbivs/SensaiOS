  #   volumes:
  #     - outbox_store:/app/Store
  #   networks:
  #     - infinity-gauntlet
  #   command: ["node", "dist/worker/outbox.js"]

  # Cache Refresh Worker
  # DISABLED FOR LOCAL DEVELOPMENT - Workers run inside main bot process
  # cache:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: infinity-gauntlet-cache
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
  #     PROD_DATABASE_URL: postgresql://gauntlet:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/infinity_gauntlet
  #     NODE_ENV: development
  #     SERVICE_NAME: cache-worker
  #     LOG_FORMAT: json
  #     LOG_BUFFER_ENABLED: "true"
  #     CACHE_WORKER_INTERVAL_MS: "3600000"
