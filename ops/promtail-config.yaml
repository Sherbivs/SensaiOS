server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Local file scraping (if mounting log files)
  - job_name: local-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: infinity-gauntlet-local
          __path__: /var/log/*.log

  # HTTP endpoint for remote logs from Render
  - job_name: render-logs
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service
            correlationId: correlationId
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
    static_configs:
      - targets:
          - localhost
        labels:
          job: infinity-gauntlet-render
          environment: production
