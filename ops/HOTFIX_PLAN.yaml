## ROLLBACK PROCEDURES

### Immediate Rollback (If Critical Issue Detected)
**Trigger Conditions:**
- Grace period prevents legitimate healing (bot fails to auto-assign new members)
- Memory leak detected (grace period Map grows unbounded)
- Authorization bypass discovered (unauthorized users set grace periods)

**Rollback Steps:**
1. Git revert commit with grace period implementation
2. Re-deploy previous working version to production
3. Restart bot service
4. Verify bot functionality restored
5. Document rollback reason and failure mode

**Rollback Command:**
```bash
git revert HEAD
git push origin main
# Trigger Render auto-deploy OR manual deploy via Dashboard
```

### Partial Rollback (Disable Grace Period Feature)
If grace period logic is problematic but bot otherwise functional:
1. Comment out grace period check before healing
2. Keep cleanup mechanism (harmless)
3. Deploy modified version
4. Investigate root cause of grace period failure

