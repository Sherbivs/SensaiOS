## FUTURE ENHANCEMENTS (Post-Hotfix)

### Alert Deduplication (Not in This Hotfix)
**Issue:** 3 independent alert paths cause duplicate notifications
- dripAlertManager: 10 calls
- activityTracker: 9 calls
- report: 49 calls

**Solution:** Centralized alerting facade with fingerprinting
- Create AlertService with deduplication Map
- Generate alert fingerprints (hash: event type + userId + roleId + timestamp window)
- Track recent alerts (5-minute sliding window)
- Replace direct alert calls with AlertService

**Priority:** HIGH (quality of life improvement)
**Estimated Effort:** 2-3 hours implementation + testing

### Configurable Grace Period Duration
**Enhancement:** Make grace period duration environment variable
- Add GRACE_PERIOD_DURATION_MS to .env
- Default: 60000 (60 seconds)
- Allow admins to tune based on server needs

**Priority:** LOW (60 seconds works for most servers)
**Estimated Effort:** 15 minutes

### Persistent Grace Period State
**Enhancement:** Store grace periods in database or Redis
- Survives bot restarts
- Maintains grace period across deploys
- More complex but more robust

**Priority:** LOW (60-second window makes restart race condition rare)
**Estimated Effort:** 2-3 hours implementation + testing

