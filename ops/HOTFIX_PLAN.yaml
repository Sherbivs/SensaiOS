## MONITORING & OBSERVABILITY

### Log Messages to Monitor
```
[GRACE_PERIOD] Set grace period for authorized Trainer role removal
[GRACE_PERIOD] Skipping healing during active grace period
[GRACE_PERIOD] Grace period expired, resuming healing
[GRACE_PERIOD] Cleaned up expired grace period entries
```

### Metrics to Track
- Grace periods set per hour (should be low, only when admins remove roles)
- Grace period cleanups per hour (every 30 seconds = 120/hour expected)
- Healing operations skipped due to grace period
- Healing operations executed after grace period expiration
- Map size (authorizedRoleRemovalGracePeriods.size) - should stay <10 normally

### Alert Conditions
- **CRITICAL:** Map size >100 (possible memory leak)
- **CRITICAL:** Grace period prevents new member role assignment (authorization bypass)
- **WARNING:** Grace period duration >90 seconds (expired entries not cleaning up)
- **NOTICE:** >10 grace periods set within 1 hour (unusual admin activity)

## KNOWN LIMITATIONS

### Grace Period Only Applies to Trainer Role
- Current implementation tracks Trainer role specifically
- Other assignable roles not covered by grace period
- **Rationale:** Trainer role is the only auto-assigned role; others are manual admin assignments

### 60-Second Duration Fixed
- Grace period duration is hardcoded (GRACE_PERIOD_DURATION_MS = 60_000)
- Not configurable via environment variable
- **Future Enhancement:** Make duration configurable if needed

### No Persistent State
- Grace periods stored in-memory Map (not database)
- Bot restart clears all active grace periods
- **Impact:** If bot restarts during grace period, healing will resume immediately
- **Rationale:** 60-second window is short enough that restart race condition is acceptable

### Authorization Check Happens Before Grace Period
- maybeAlertRoleAssignments evaluates authorization
- Grace period set AFTER authorization passes
- **Implication:** Unauthorized removals never set grace period (by design)

