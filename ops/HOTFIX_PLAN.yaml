# HOTFIX PLAN: Grace Period for Authorized Role Removals
# Date: 2025-12-11
# Severity: CRITICAL - Production bot disabled due to infinite healing loop
# Issue ID: Race condition in guildMemberUpdate handler

## ROOT CAUSE ANALYSIS

### Problem Summary
When an admin removes the Trainer role from a user:
1. guildMemberUpdate event fires → Discord.js detects role change
2. Authorization check passes (admin action recognized) ✅
3. Cache invalidation occurs after authorized change
4. Healing logic (ensureTrainerFor) executes IMMEDIATELY
5. Bot sees user has no roles after cache invalidation
6. Bot re-adds Trainer role automatically
7. Loop repeats infinitely (cache invalidation → healing → revert)

### Technical Mechanism
- **File:** src/bot/main.js
- **Location:** Lines 3829-3898 (guildMemberUpdate event handler)
- **Root Cause:** NO grace period tracking between cache invalidation and healing logic
- **Authorization:** Works correctly via evaluateExecutorAuthorization (lines 1117-1165)
  - Bot: authorized (reason: 'security-bot')
  - Guild Owner: authorized (reason: 'guild-owner')
  - Administrator: authorized (reason: 'administrator') - Checks PermissionsBitField.Flags.Administrator
  - Others: unauthorized → immediate revert

### Secondary Issue
Alert duplication across 3 independent paths:
- dripAlertManager.recordAlert: 10 calls
- activityTracker.recordActivity: 9 calls
- report function: 49 calls

**Note:** Secondary issue NOT addressed in this hotfix. Will be resolved separately via centralized alerting facade.

## IMPLEMENTATION STRATEGY

### Grace Period Solution
**Approach:** Add 60-second grace period Map tracking authorized Trainer role removals

**Data Structure:**
```javascript
const authorizedRoleRemovalGracePeriods = new Map();
// Map<userId, { timestamp, executor, reason, roleId }>
```

**Logic Flow:**
1. Before healing: Check if user has active grace period (<60 seconds elapsed)
2. If grace period active: Skip healing, respect admin's intentional removal
3. If grace period expired: Remove from Map, allow healing to proceed
4. After authorized removal detected: Set 60-second grace period entry

**Memory Management:**
- Auto-cleanup every 30 seconds via setInterval
- Removes expired entries (>60 seconds old)
- Prevents memory leaks from abandoned grace periods

## AFFECTED FILES

### Primary Changes
- **src/bot/main.js** (Lines 3829-3950 modified)
  - Added authorizedRoleRemovalGracePeriods Map (line 3829)
  - Added GRACE_PERIOD_DURATION_MS constant (60 seconds)
  - Added cleanupExpiredGracePeriods() helper function
  - Added setInterval cleanup (every 30 seconds)
  - Modified guildMemberUpdate handler:
    - Check grace period BEFORE healing logic
    - Skip healing if within 60-second window
    - Set grace period AFTER authorized Trainer role removal detected
    - Log grace period activity (set, check, expire)

### No Changes Required
- **Authorization logic** (lines 1117-1165) - Already correct ✅
- **maybeAlertRoleAssignments** (lines 1986-2150) - No modification needed ✅
- **ensureTrainerFor** - Healing logic unchanged ✅

## TESTING PROCEDURES

### Local Testing (npm run dev)
**Test Scenario 1: New Member Join**
1. Start bot with `npm run dev`
2. New user joins Discord server
3. **Expected:** User receives Trainer role automatically
4. **Verify:** No grace period set (join !== removal)

**Test Scenario 2: Admin Removes Trainer Role (Grace Period Active)**
1. Admin removes Trainer role from test user
2. **Expected:** Grace period set for 60 seconds
3. **Expected:** Bot logs "[GRACE_PERIOD] Set grace period for authorized Trainer role removal"
4. **Expected:** Bot does NOT re-add role immediately
5. Wait 30 seconds
6. **Expected:** Bot still respects grace period (logs "[GRACE_PERIOD] Skipping healing during active grace period")

**Test Scenario 3: Grace Period Expires (Healing Resumes)**
1. Continue from Test Scenario 2
2. Wait 61 seconds total (past 60-second grace period)
3. **Expected:** Grace period expires and is removed from Map
4. **Expected:** Bot logs "[GRACE_PERIOD] Grace period expired, resuming healing"
5. **Expected:** Bot re-adds Trainer role (healing resumes)

**Test Scenario 4: Unauthorized Role Removal (Immediate Revert)**
1. Non-admin user removes Trainer role (or simulate unauthorized removal)
2. **Expected:** NO grace period set (unauthorized action)
3. **Expected:** Immediate role revert by security bot
4. **Expected:** Security alert sent to admin

**Test Scenario 5: Multiple Users (Isolation)**
1. Admin removes role from User A (grace period active)
2. Admin removes role from User B (grace period active)
3. **Expected:** Both users have independent grace periods
4. **Expected:** No cross-contamination between users

