 # Canonical AI routing map — single source of “where to look / where to write”.
# All paths are repo-relative. Case-sensitive.
version: 1
updated_utc: 2025-10-29T12:30:00Z

meta_files:
  - Patch.md
  - Tasklist.md
  - Prompt.md
  - ops/ROUTER.yaml
  - ops/NEXT.yaml
  - ops/TOUCHMAP.yaml
  - ops/CRITICAL.md
  - ops/PATCH_POLICY_BACKUP.md
  - ops/change-ledger.md

inbox:
  # Fast notes the human can edit; AI must read first if newer than NEXT.last_notes_read_utc
  path: ops/INBOX/notes.md

entrypoints:
  node_start: dist/index.js
  ts_entry: src/index.ts
  tsconfig: tsconfig.json
  package: package.json

categories:
  contract:
    - Patch.md
    - ops/CRITICAL.md
  tasks:
    - Tasklist.md
    - ops/NEXT.yaml
    - ops/TOUCHMAP.yaml
  prompt:
    - Prompt.md
  ledger:
    - ops/change-ledger.md
  infra_docs:
    - RULESET.md
    - DATA-SCHEMA.md
    - OPERATIONS.md
    - ops/POKEMON_CACHE.md
    - ops/DB_BOOTSTRAP.md
    - ops/DB_IMPORT_PRISMA_POSTGRES.md
    - discord-pokemon-bot/data/standized_pokemon_game_logic.md
    - docs/PBSL.md
    - masterroutetable.md
  code_core:
    - src/**
    - tests/**
  ops_scripts:
    - scripts/**
    - scripts/bootstrap_staging_db.ps1
    - scripts/restore_prisma_postgres.ps1
  guards_ci:
    - .github/workflows/**
  router_docs:
    - ops/ROUTER.md
    - ops/ROUTER_INDEX.yaml
    - masterroutetable.md
    - scripts/guard_*.sh

router_contract:
  docs_update_command: "npm run docs:update-routers"
  generated_outputs_read_only:
    - ops/ROUTER_INDEX.yaml
    - masterroutetable.md
  guard_script: scripts/guard_router_docs.sh

# Always-allowed meta writes (headers/timestamps/Last Repo Changes only):
meta_write_whitelist:
  - Patch.md
  - Tasklist.md
  - Prompt.md
  - ops/NEXT.yaml
  - ops/ROUTER.yaml
  - ops/TOUCHMAP.yaml
  - ops/HOTFIX.md
  - ops/HOTFIX_PLAN.yaml
