# NEXT POINTER — Single-file pointer for the next actionable task and file hints.
# The AI should read this first, then confirm against Tasklist.md, then proceed.
# GUIDANCE: If `next_task_id` is `NONE`, follow `guidance_when_none` below to pick the
# first READY task, update this file, and document why.
# Markerless Mode is allowed for a single run; Postflight still refuses to exit until `next_task_id` targets READY.

guidance_when_none: |
  Run the Preflight policy: If no READY exists (excluding the seed), promote the oldest eligible PROPOSED; if none exist, inject META.UNBLOCK.READY_SEED.

  Set `next_task_id` to that choice, keep `files_hint` minimal, bump `timestamp_utc`, and write a one-line rationale in `note`.

  If meta docs are unreadable or missing, halt and request refreshed copies (see CRITICAL.md).

auto_promote_if_empty: true

next_task_id: META.UNBLOCK.READY_SEED
reason: "Seed placeholder READY task while the backlog is idle; promote a substantive item once new scope lands."

files_hint:
  - Tasklist.md

queue:
  - id: META.UNBLOCK.READY_SEED
    note: "Placeholder READY task to keep NEXT valid until the next substantive item is promoted."

timestamp_utc: 2025-11-01T18:10:00Z
router_version: 1
last_notes_read_utc: 2025-10-30T05:00:00Z
note: "Backlog currently idle; KEEP seed READY task active until humans queue new work."
