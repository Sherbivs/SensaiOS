# NEXT POINTER — Single-file pointer for the next actionable task and file hints.
# The AI should read this first, then confirm against Tasklist.md, then proceed.
# GUIDANCE: If `next_task_id` is `NONE`, follow `guidance_when_none` below to pick the
# first READY task, update this file, and document why.

guidance_when_none: |
  - Open Tasklist.md and select the first READY task whose dependencies are DONE.
  - Update `next_task_id`, trim `files_hint` to only the files you expect to touch, and bump `timestamp_utc`.
  - Record the rationale in `note` so the next worker knows why the pointer moved.

next_task_id: META.RECOVERY.REPLAY
reason: >
  With coupling guards in place, wire recovery guidance so resumptions prefer the last
  attempted task and avoid NEXT drifting to NONE without direction.

files_hint:
  - "ops/RECOVERY.yaml"
  - "Tasklist.md"
  - "Patch.md"
  - "Prompt.md"
  - "ops/NEXT.yaml"

timestamp_utc: 2025-10-25T08:20:00Z
router_version: 1
last_notes_read_utc: 2025-10-25T03:30:00Z
note: "META.NEXT.BOOTSTRAP done; execute META.RECOVERY.REPLAY to teach the engine how to resume after interruptions."

# Advisory flag read by guard scripts; safe to ignore if unsupported
auto_requeue_if_none: true
