# NEXT POINTER — Multi-task queue for parallel actionable work and file hints.
# The AI should read this first, then confirm against Tasklist.md, then proceed.
# GUIDANCE: Up to 3 main tasks + 1 quick/hot task can be worked simultaneously.
# Main tasks: Full implementation work requiring multiple commits.
# Quick/hot tasks: Bug fixes, documentation updates, or hotfixes (< 30 min work).
#
# SPECIALIST TEAM COORDINATION (Team-Based AI Workflow):
# Each task must include:
# - specialists_required: [ai_coding (lead), documentation, architecture, ...] - Auto-detected from work type
# - specialist_signoffs: {specialist: pending|approved|concerns} - Quality gates tracking
# See Patch.md § "Specialist Team Coordination" for detection rules, 5-phase workflow, quality gates.
#
# META-SYSTEM HEALTH ENFORCEMENT (Anti-Stuck Rules):
# The quick_task slot can be FORCE-ASSIGNED by Postflight checks to prevent technical debt:
# - META.ROUTER.SYNC: 5+ code changes without router updates (Documentation Specialist escalation)
# - META.BIBLE.CONSOLIDATE: 10+ changes without Bible documentation (Architecture/Documentation Specialist escalation)
# - META.TASKLIST.ARCHIVE: 20+ DONE tasks accumulating
# - META.PROMPT.COMPRESS: Prompt.md >500 lines
# These forced tasks MUST complete before resuming main work (prevents system decay).

guidance_when_none: |
  Run the Preflight policy: If no READY exists (excluding the seed), promote the oldest eligible PROPOSED; if none exist, inject META.UNBLOCK.READY_SEED.

  Set `next_task_id` to that choice, keep `files_hint` minimal, bump `timestamp_utc`, and write a one-line rationale in `note`.

  If meta docs are unreadable or missing, halt and request refreshed copies (see CRITICAL.md).

auto_promote_if_empty: true

