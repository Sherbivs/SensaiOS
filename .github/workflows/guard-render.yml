name: guard-render

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  guard-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate Render configuration
        run: node scripts/guard_render.mjs
      - name: Verify Prisma preload order
        run: node scripts/guards/require-ensure-db-preload.mjs
