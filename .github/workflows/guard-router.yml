name: guard-router
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  guard-router-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify router/index exact-name/case
        run: |
          chmod +x scripts/verify_router_links.sh
          scripts/verify_router_links.sh
