name: Guard meta updates (Prompt/Tasklist/Patch)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (need prior commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run meta guard
        run: bash scripts/guard_meta.sh
