name: guard-dexpack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dexpack-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Verify dexpack artifacts
        run: npm run guard:dexpack
