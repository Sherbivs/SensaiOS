name: Health Check Watchdog

# Purpose: Monitor health endpoint and auto-restart service on failures
# Strategy: Ping health endpoint every 5 minutes, restart after 3 consecutive failures
# Note: Health endpoint runs on worker service (port 3000), checked via internal network

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    name: Check Service Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check health endpoint via Render Shell
        id: health_check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d3snk2ndiees73cn709g
        run: |
          echo "🏥 Checking health endpoint..."
          
          # Execute health check via Render Shell API
          # The health endpoint runs on localhost:3000 within the service
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"command": "curl -s -w \"\\n%{http_code}\" http://localhost:3000/health"}' \
            "https://api.render.com/v1/services/$SERVICE_ID/shell")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" = "200" ]; then
            echo "✅ Successfully executed shell command"
            
            # Parse health endpoint response from shell output
            # Output format: {"status":"healthy",...}\n200
            health_response=$(echo "$body" | jq -r '.output' 2>/dev/null || echo "$body")
            health_status=$(echo "$health_response" | tail -n1)
            health_body=$(echo "$health_response" | sed '$d')
            
            echo "Health endpoint HTTP code: $health_status"
            echo "Health endpoint response: $health_body"
            
            if [ "$health_status" = "200" ]; then
              echo "✅ Service is healthy!"
              echo "health_status=healthy" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "⚠️ Health endpoint returned non-200: $health_status"
              echo "health_status=unhealthy" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "❌ Failed to execute shell command (HTTP $http_code)"
            echo "Response: $body"
            echo "health_status=failed" >> $GITHUB_OUTPUT
            exit 0
          fi
      
      - name: Record failure
        if: steps.health_check.outputs.health_status != 'healthy'
        run: |
          echo "⚠️ Health check failed - recording failure"
          
          # Create failure marker file with timestamp
          mkdir -p .health-check-failures
          timestamp=$(date -u +%s)
          echo "$timestamp" > .health-check-failures/failure-$timestamp.txt
          
          # Count consecutive failures (last 3 checks = 15 minutes)
          failure_count=$(find .health-check-failures -name "failure-*.txt" -mmin -15 | wc -l)
          echo "Consecutive failures in last 15 minutes: $failure_count"
          
          if [ "$failure_count" -ge 3 ]; then
            echo "❌ CRITICAL: 3+ consecutive failures detected!"
            echo "trigger_restart=true" >> $GITHUB_ENV
          else
            echo "⚠️ Failure recorded, waiting for more failures before restart"
            echo "trigger_restart=false" >> $GITHUB_ENV
          fi
      
      - name: Clean up old failure markers
        if: steps.health_check.outputs.health_status == 'healthy'
        run: |
          echo "✅ Service healthy - clearing failure markers"
          rm -rf .health-check-failures
      
      - name: Restart service on critical failure
        if: env.trigger_restart == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d3snk2ndiees73cn709g
        run: |
          echo "🚨 CRITICAL: Triggering automatic service restart"
          
          # Trigger service restart via Render API
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$SERVICE_ID/restart")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "202" ]; then
            echo "✅ Service restart triggered successfully"
            echo "$body" | jq '.' || echo "$body"
            
            # Clear failure markers after successful restart
            rm -rf .health-check-failures
            exit 0
          else
            echo "❌ Service restart failed"
            echo "$body" | jq '.' || echo "$body"
            exit 1
          fi
      
      - name: Wait for recovery after restart
        if: env.trigger_restart == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d3snk2ndiees73cn709g
        run: |
          echo "⏳ Waiting for service to recover..."
          
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Checking service status..."
            
            # Get service status
            response=$(curl -s -w "\n%{http_code}" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID")
            
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            
            if [ "$http_code" = "200" ]; then
              status=$(echo "$body" | jq -r '.service.serviceDetails.state // "unknown"')
              echo "  Service state: $status"
              
              if [ "$status" = "running" ] || [ "$status" = "available" ]; then
                echo "✅ Service recovered!"
                exit 0
              fi
            else
              echo "  ⚠️ Failed to check status (HTTP $http_code)"
            fi
            
            sleep 10
          done
          
          echo "❌ Service did not recover within timeout (5 minutes)"
          echo "Manual intervention required - check Render dashboard"
          exit 1
      
      - name: Notify on critical failure
        if: failure()
        run: |
          echo "❌ Health check watchdog failed!"
          echo "Service may be down and unable to restart automatically"
          echo "Dashboard: https://dashboard.render.com/services/srv-d3snk2ndiees73cn709g"
          echo "Logs: https://dashboard.render.com/services/srv-d3snk2ndiees73cn709g/logs"
