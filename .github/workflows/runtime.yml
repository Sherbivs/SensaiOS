name: runtime-guard

on:
  pull_request:
    paths:
      - "render.yaml"
      - "src/**"
      - "tests/**"
      - "scripts/guard_runtime.sh"
      - "prisma/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/runtime.yml"

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prebuild

      - name: Build TypeScript
        run: npm run build

      - name: Guard runtime configuration
        run: ./scripts/guard_runtime.sh
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://render.example/prod

      - name: Assert DATABASE_URL is remote in production
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); if (['localhost','127.0.0.1','::1'].includes(url.hostname)) { throw new Error('DATABASE_URL must not be localhost'); }"
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://render.example/prod

      - name: Run runtime vitest suites
        run: npx vitest run tests/runtime_config.spec.ts tests/outbox.spec.ts tests/ops_stats.spec.ts
