name: Store Logs - Dashboard Access

# Purpose: Provide quick access to Render Dashboard Shell for /Store logs
# Note: Shell API not available on Starter plan - use Dashboard Shell instead
# Dashboard Shell: https://dashboard.render.com/services/srv-d3snk2ndiees73cn709g/shell

on:
  workflow_dispatch:
    inputs:
      log_path:
        description: 'Log path to access (reference only)'
        required: false
        default: '/Store/'
        type: string

jobs:
  dashboard-guide:
    name: Dashboard Shell Guide
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Display Dashboard Shell Instructions
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d3snk2ndiees73cn709g
          LOG_PATH: ${{ inputs.log_path }}
        run: |
          echo "📂 Accessing /Store Logs on Production"
          echo "======================================"
          echo ""
          echo "🌐 Open Render Dashboard Shell:"
          echo "   👉 https://dashboard.render.com/services/$SERVICE_ID/shell"
          echo ""
          echo "📝 Requested Path: $LOG_PATH"
          echo ""
          
          # Provide commands based on path
          echo "🔧 Commands for Dashboard Shell:"
          echo ""
          
          if [[ "$LOG_PATH" == */ ]]; then
            echo "   # List directory:"
            echo "   ls -lah $LOG_PATH"
            echo ""
            echo "   # With details:"
            echo "   du -sh $LOG_PATH*"
          else
            echo "   # View entire file:"
            echo "   cat $LOG_PATH"
            echo ""
            echo "   # View last 50 lines:"
            echo "   tail -n 50 $LOG_PATH"
            echo ""
            echo "   # View first 20 lines:"
            echo "   head -n 20 $LOG_PATH"
            echo ""
            echo "   # Search in file:"
            echo "   grep 'search-term' $LOG_PATH"
            echo ""
            echo "   # Pretty print JSON:"
            echo "   cat $LOG_PATH | jq ."
          fi
          
          echo ""
          echo "📋 Common Log Locations:"
          echo ""
          echo "   🔄 Restart Metrics:"
          echo "      /Store/restart-metrics.json"
          echo ""
          echo "   🛡️  Security Bot State:"
          echo "      /Store/security-bot-state/current.json"
          echo "      /Store/security-bot-state/previous.json"
          echo "      /Store/security-bot-state/snapshots/"
          echo ""
          echo "   💾 Runtime Cache:"
          echo "      /Store/runtime-cache/"
          echo ""
          echo "   💬 Discord Cache:"
          echo "      /Store/discord-cache/"
          echo ""
          echo "   📊 Database Mirrors:"
          echo "      /Store/onpremise-dev-primary/"
          echo ""
          
          # Verify service status
          echo "✅ Verifying service access..."
          SERVICE_INFO=$(curl -s "https://api.render.com/v1/services/$SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          if echo "$SERVICE_INFO" | jq -e . >/dev/null 2>&1; then
            NAME=$(echo "$SERVICE_INFO" | jq -r '.name // "N/A"')
            STATE=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.state // "N/A"')
            REGION=$(echo "$SERVICE_INFO" | jq -r '.serviceDetails.region // "N/A"')
            
            echo ""
            echo "📊 Service Status:"
            echo "   Name: $NAME"
            echo "   State: $STATE"
            echo "   Region: $REGION"
            echo ""
            
            if [ "$STATE" = "live" ]; then
              echo "✅ Service is LIVE - Dashboard Shell available"
            else
              echo "⚠️  Service state: $STATE - Shell may not be accessible"
            fi
          else
            echo "⚠️  Could not verify service status"
          fi
          
          echo ""
          echo "======================================"
          echo "📖 Copy the Dashboard Shell URL above and open in browser"
          echo "🚀 Then run the suggested commands to view your logs"
