name: PBSL Oracle

on:
  push:
    branches:
      - main
    paths:
      - 'src/core/pbsl/**'
      - 'tests/pbsl/**'
      - 'docs/PBSL.md'
      - 'package.json'
      - 'tsconfig*.json'
  pull_request:
    paths:
      - 'src/core/pbsl/**'
      - 'tests/pbsl/**'
      - 'docs/PBSL.md'
      - 'package.json'
      - 'tsconfig*.json'

jobs:
  validate:
    name: Run PBSL deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint sources
        run: npm run lint

      - name: Run PBSL tests with oracle report
        id: pbsl-tests
        run: npm run test:pbsl -- --reporter=json --outputFile pbsl-oracle-report.json
        continue-on-error: true

      - name: Upload oracle diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbsl-oracle-report
          path: pbsl-oracle-report.json
          if-no-files-found: ignore

      - name: Fail if PBSL oracle regressions detected
        if: steps.pbsl-tests.outcome == 'failure'
        run: exit 1
