# Dead Code Detection Workflow
# =================================
# 
# Runs on every push and PR to detect unused code.
# Uses ts-prune for unused exports, depcheck for unused dependencies.
#
# @see docs/development-bible/10-dead-code-analysis.md
# @since 2025-12-21

name: Dead Code Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dead-code:
    name: Detect Dead Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for unused exports (ts-prune)
        id: ts-prune
        continue-on-error: true
        run: |
          echo "## Unused Exports Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Run ts-prune and capture output
          npx ts-prune --error 2>&1 | tee ts-prune-report.txt || true
          
          # Count unused exports (lines containing 'used in module')
          UNUSED_COUNT=$(grep -c "used in module" ts-prune-report.txt 2>/dev/null || echo "0")
          
          echo "Unused exports found: $UNUSED_COUNT"
          echo "unused_count=$UNUSED_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$UNUSED_COUNT" -gt 0 ]; then
            echo "### ⚠️ Found $UNUSED_COUNT unused exports" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -20 ts-prune-report.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            if [ "$UNUSED_COUNT" -gt 20 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "_... and $(($UNUSED_COUNT - 20)) more_" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ✅ No unused exports detected" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Check for unused dependencies (depcheck)
        id: depcheck
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Unused Dependencies Analysis" >> $GITHUB_STEP_SUMMARY
          
          # Run depcheck and capture JSON output
          npx depcheck --json > depcheck-report.json 2>/dev/null || true
          
          # Parse unused dependencies count
          UNUSED_DEPS=$(jq '.dependencies | length' depcheck-report.json 2>/dev/null || echo "0")
          UNUSED_DEV_DEPS=$(jq '.devDependencies | length' depcheck-report.json 2>/dev/null || echo "0")
          
          echo "Unused dependencies: $UNUSED_DEPS"
          echo "Unused devDependencies: $UNUSED_DEV_DEPS"
          echo "unused_deps=$UNUSED_DEPS" >> $GITHUB_OUTPUT
          echo "unused_dev_deps=$UNUSED_DEV_DEPS" >> $GITHUB_OUTPUT
          
          if [ "$UNUSED_DEPS" -gt 0 ] || [ "$UNUSED_DEV_DEPS" -gt 0 ]; then
            echo "### ⚠️ Found unused dependencies" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$UNUSED_DEPS" -gt 0 ]; then
              echo "**Dependencies ($UNUSED_DEPS):**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              jq -r '.dependencies[]' depcheck-report.json >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "$UNUSED_DEV_DEPS" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**DevDependencies ($UNUSED_DEV_DEPS):**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              jq -r '.devDependencies[]' depcheck-report.json >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ✅ No unused dependencies detected" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload dead code reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dead-code-reports
          path: |
            ts-prune-report.txt
            depcheck-report.json
          retention-days: 7
      
      - name: Check thresholds
        run: |
          UNUSED_COUNT=${{ steps.ts-prune.outputs.unused_count || '0' }}
          UNUSED_DEPS=${{ steps.depcheck.outputs.unused_deps || '0' }}
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          
          # Configurable thresholds (fail if exceeded)
          # Set high initially to gather baseline data
          MAX_UNUSED_EXPORTS=50
          MAX_UNUSED_DEPS=5
          
          FAILED=false
          
          if [ "$UNUSED_COUNT" -gt "$MAX_UNUSED_EXPORTS" ]; then
            echo "::error::Too many unused exports ($UNUSED_COUNT > $MAX_UNUSED_EXPORTS)"
            echo "❌ **FAILED:** Unused exports ($UNUSED_COUNT) exceeds threshold ($MAX_UNUSED_EXPORTS)" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "✅ Unused exports ($UNUSED_COUNT) within threshold ($MAX_UNUSED_EXPORTS)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$UNUSED_DEPS" -gt "$MAX_UNUSED_DEPS" ]; then
            echo "::error::Too many unused dependencies ($UNUSED_DEPS > $MAX_UNUSED_DEPS)"
            echo "❌ **FAILED:** Unused dependencies ($UNUSED_DEPS) exceeds threshold ($MAX_UNUSED_DEPS)" >> $GITHUB_STEP_SUMMARY
            FAILED=true
          else
            echo "✅ Unused dependencies ($UNUSED_DEPS) within threshold ($MAX_UNUSED_DEPS)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$FAILED" = true ]; then
            exit 1
          fi
