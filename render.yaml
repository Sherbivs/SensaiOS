databases:
  - name: infinity-gauntlet-db
    plan: starter
    databaseName: infinity_gauntlet
    user: gauntlet

services:
  # New web service for the compiled bot (fixes missing npm start by running dist output)
  - type: web
    name: infinity-gauntlet-bot
    runtime: node
    buildCommand: rm -rf node_modules && rm -rf node_modules/.prisma && rm -rf node_modules/@prisma && npm install --include=dev && npm run prebuild && bash scripts/bootstrap_prod_node.sh
    startCommand: npm start
    autoDeploy: true
    plan: starter
    disks:
      - name: prod-database
        mountPath: /opt/render/project/src/Store
        sizeGB: 2
    envVars:
      # 2-NODE CLUSTER: PROD_DATABASE_URL (local on disk), DEV_DATABASE_URL (master on Render PostgreSQL)
      # DATABASE_URL must be set for Prisma client generation (build time)
      - key: DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: PROD_DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: web
      - key: LOG_FORMAT
        value: cli

  - type: worker
    name: infinity-gauntlet-outbox
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild && bash scripts/bootstrap_prod_node.sh"
    startCommand: "node dist/worker/outbox.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /opt/render/project/src/Store
        sizeGB: 2
    envVars:
      # 2-NODE CLUSTER: PROD_DATABASE_URL (local), DEV_DATABASE_URL (master)
      # DATABASE_URL must be set for Prisma client generation (build time)
      - key: DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: PROD_DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: outbox-worker
      - key: LOG_FORMAT
        value: json
      - key: OUTBOX_MIN_DELAY_MS
        value: "250"
      - key: OUTBOX_MAX_DELAY_MS
        value: "1500"
      - key: OUTBOX_HEALTH_INTERVAL
        value: "20"
      - key: OUTBOX_BATCH_SIZE
        value: "100"

  # Discord bot worker
  - type: worker
    name: infinity-gauntlet-bots
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild && bash scripts/bootstrap_prod_node.sh"
    startCommand: "npm start"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /opt/render/project/src/Store
        sizeGB: 2
    envVars:
      # 2-NODE CLUSTER: PROD_DATABASE_URL (local), DEV_DATABASE_URL (master)
      # DATABASE_URL must be set for Prisma client generation (build time)
      - key: DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: PROD_DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      # Auto-sync uses DEV_DATABASE_URL (master) as source
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: discord-bots
      - key: LOG_FORMAT
        value: cli
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: POKEMON_BOT_TOKEN
        sync: false
      - key: ENABLE_POKEMON_BOT
        value: "true"
      - key: ENABLE_SECURITY_BOT
        value: "false"
      - key: ENABLE_DB_AUTO_SYNC
        value: "true"
      - key: BATTLE_CHANNEL_NAME
        value: pokemon-battles
      - key: DISABLE_SNAPSHOT_PRECHECK
        value: "true"

  - type: worker
    name: infinity-gauntlet-security
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "node security-bot.js"
    autoDeploy: true
    disks:
      - name: security-state
        mountPath: /opt/render/project/src/Store
        sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: security-bot
      - key: LOG_FORMAT
        value: json
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: ENABLE_SECURITY_BOT
        value: "true"
      - key: ENABLE_CONTINUOUS_SWEEP
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_CHANNEL_ID
        sync: false
      - key: ALERT_USER_ID
        sync: false
      - key: ROLE_NAME
        value: Trainer
      - key: DISABLE_SNAPSHOT_PRECHECK
        value: "true"

  - type: worker
    name: infinity-gauntlet-cache
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild && bash scripts/bootstrap_prod_node.sh"
    startCommand: "node dist/worker/cache-refresh.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /opt/render/project/src/Store
        sizeGB: 2
    envVars:
      # 2-NODE CLUSTER: PROD_DATABASE_URL (local), DEV_DATABASE_URL (master)
      # DATABASE_URL must be set for Prisma client generation (build time)
      - key: DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: PROD_DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: cache-worker
      - key: LOG_FORMAT
        value: json
      - key: CACHE_WORKER_INTERVAL_MS
        value: "0"
      - key: CACHE_WORKER_INTERVAL_JITTER_MS
        value: "0"

  - type: worker
    name: infinity-gauntlet-data-pipeline
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild && bash scripts/bootstrap_prod_node.sh"
    startCommand: "node dist/worker/data-pipeline.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /opt/render/project/src/Store
        sizeGB: 2
    envVars:
      # 2-NODE CLUSTER: PROD_DATABASE_URL (local), DEV_DATABASE_URL (master)
      # DATABASE_URL must be set for Prisma client generation (build time)
      - key: DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: PROD_DATABASE_URL
        value: postgresql://postgres@127.0.0.1:55433/infinity_gauntlet_db
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: data-pipeline-worker
      - key: LOG_FORMAT
        value: json
      - key: DATA_PIPELINE_INTERVAL_MS
        value: "86400000"
      - key: DATA_PIPELINE_INTERVAL_JITTER_MS
        value: "900000"
      - key: DATA_PIPELINE_RUN_ON_BOOT
        value: "false"

  # Canonical Pokédex cache worker (persistent disk + scheduler)
  - type: worker
    name: pokedex-cache-worker
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "node scripts/worker.mjs"
    autoDeploy: true
    disks:
      - name: pokedata
        mountPath: /store
        sizeGB: 1
    envVars:
      # 2-NODE CLUSTER: Uses DEV_DATABASE_URL (master) for data loading
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: LOG_FORMAT
        value: cli
      - key: GITHUB_REPO
        value: https://github.com/sherbivs/infinity-gauntlet.git
      - key: GITHUB_BRANCH
        value: data-cache
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: GITHUB_RAW_URL
        value: https://raw.githubusercontent.com/sherbivs/infinity-gauntlet/data-cache/data/cache
      - key: CACHE_DIR
        value: /store/cache
      - key: POKE_CONCURRENCY
        value: "10"
      - key: POKE_TIMEOUT_MS
        value: "15000"
      - key: POKE_REFRESH_CRON
        value: "0 0 * * 4"
      - key: POKE_REFRESH_TZ
        value: America/New_York
      - key: POKE_RUN_JOB_ON_BOOT
        value: "true"
      - key: POKE_REFRESH_JOB_COMMAND
        value: node scripts/refresh_cache.mjs
      - key: RENDER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # Optional failsafe cron job: refresh GitHub fallback only
  - type: cron
    name: pokedex-cache-failsafe
    runtime: node
    plan: starter
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "node scripts/refresh_cache_gh_only.mjs"
    schedule: "0 0 * * 4"
    envVars:
      # 2-NODE CLUSTER: Uses DEV_DATABASE_URL (master)
      - key: DEV_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: LOG_FORMAT
        value: cli
      - key: GITHUB_REPO
        value: https://github.com/sherbivs/infinity-gauntlet.git
      - key: GITHUB_BRANCH
        value: data-cache
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: CACHE_DIR
        value: /tmp/cache
      - key: GITHUB_TOKEN
        sync: false
