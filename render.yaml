databases:
  - name: infinity-gauntlet-db
    plan: starter
    databaseName: infinity_gauntlet
    user: gauntlet

services:
  # New web service for the compiled bot (fixes missing npm start by running dist output)
  - type: web
    name: infinity-gauntlet-bot
    runtime: node
    rootDirectory: .
    buildCommand: rm -rf node_modules && rm -rf node_modules/.prisma && rm -rf node_modules/@prisma && npm install --include=dev && npm run prebuild
    startCommand: npm start
    autoDeploy: true
    plan: starter
    disks:
      - name: prod-database
        mountPath: /Store
        sizeGB: 2
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: web
      - key: LOG_FORMAT
        value: cli
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"

  - type: worker
    name: infinity-gauntlet-outbox
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node dist/worker/outbox.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /Store
        sizeGB: 2
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: outbox-worker
      - key: LOG_FORMAT
        value: json
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: OUTBOX_MIN_DELAY_MS
        value: "250"
      - key: OUTBOX_MAX_DELAY_MS
        value: "1500"
      - key: OUTBOX_HEALTH_INTERVAL
        value: "20"
      - key: OUTBOX_BATCH_SIZE
        value: "100"

  # Discord bot worker
  - type: worker
    name: infinity-gauntlet
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild"
    startCommand: "npm start"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /Store
        sizeGB: 2
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      # Note: Auto-sync disabled in unified mode (all URLs point to same database)
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: discord-bots
      - key: LOG_FORMAT
        value: cli
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: POKEMON_BOT_TOKEN
        sync: false
      - key: ENABLE_POKEMON_BOT
        value: "true"
      - key: ENABLE_SECURITY_BOT
        value: "false"
      - key: ENABLE_DB_AUTO_SYNC
        value: "false"
      - key: BATTLE_CHANNEL_NAME
        value: pokemon-battles
      - key: DISABLE_SNAPSHOT_PRECHECK
        value: "true"

  - type: worker
    name: infinity-gauntlet-security
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node security-bot.js"
    autoDeploy: true
    disks:
      - name: security-state
        mountPath: /Store
        sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: security-bot
      - key: LOG_FORMAT
        value: json
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: ENABLE_SECURITY_BOT
        value: "true"
      - key: ENABLE_CONTINUOUS_SWEEP
        value: "true"
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_CHANNEL_ID
        sync: false
      - key: ALERT_USER_ID
        sync: false
      - key: ROLE_NAME
        value: Trainer
      - key: DISABLE_SNAPSHOT_PRECHECK
        value: "true"

  - type: worker
    name: infinity-gauntlet-cache
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node dist/worker/cache-refresh.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /Store
        sizeGB: 2
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: cache-worker
      - key: LOG_FORMAT
        value: json
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: CACHE_WORKER_INTERVAL_MS
        value: "0"
      - key: CACHE_WORKER_INTERVAL_JITTER_MS
        value: "0"

  - type: worker
    name: infinity-gauntlet-data-pipeline
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "rm -rf node_modules && npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node dist/worker/data-pipeline.js"
    autoDeploy: true
    disks:
      - name: prod-database
        mountPath: /Store
        sizeGB: 2
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: data-pipeline-worker
      - key: LOG_FORMAT
        value: json
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: DATA_PIPELINE_INTERVAL_MS
        value: "86400000"
      - key: DATA_PIPELINE_INTERVAL_JITTER_MS
        value: "900000"
      - key: DATA_PIPELINE_RUN_ON_BOOT
        value: "false"

  # Canonical Pokédex cache worker (persistent disk + scheduler)
  - type: worker
    name: pokedex-cache-worker
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node scripts/worker.mjs"
    autoDeploy: true
    disks:
      - name: pokedata
        mountPath: /Store
        sizeGB: 1
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: LOG_FORMAT
        value: cli
      - key: LOG_BUFFER_ENABLED
        value: "true"
      - key: LOG_BUFFER_INTERVAL
        value: "10000"
      - key: LOG_BUFFER_BYPASS_CRITICAL
        value: "true"
      - key: GITHUB_REPO
        value: https://github.com/sherbivs/infinity-gauntlet.git
      - key: GITHUB_BRANCH
        value: data-cache
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: GITHUB_RAW_URL
        value: https://raw.githubusercontent.com/sherbivs/infinity-gauntlet/data-cache/data/cache
      - key: CACHE_DIR
        value: /Store/cache
      - key: POKE_CONCURRENCY
        value: "10"
      - key: POKE_TIMEOUT_MS
        value: "15000"
      - key: POKE_REFRESH_CRON
        value: "0 0 * * 4"
      - key: POKE_REFRESH_TZ
        value: America/New_York
      - key: POKE_RUN_JOB_ON_BOOT
        value: "true"
      - key: POKE_REFRESH_JOB_COMMAND
        value: node scripts/refresh_cache.mjs
      - key: RENDER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # Optional failsafe cron job: refresh GitHub fallback only
  - type: cron
    name: pokedex-cache-failsafe
    runtime: node
    plan: starter
    repo: https://github.com/sherbivs/infinity-gauntlet
    branch: main
    rootDirectory: .
    buildCommand: "npm install --include=dev && npm run prebuild"
    startCommand: "cd /opt/render/project && node scripts/refresh_cache_gh_only.mjs"
    schedule: "0 0 * * 4"
    envVars:
      # Unified architecture: Single Render-managed PostgreSQL database
      - key: PROD_DATABASE_URL
        fromDatabase:
          name: infinity-gauntlet-db
          property: connectionString
      - key: LOG_FORMAT
        value: cli
      - key: GITHUB_REPO
        value: https://github.com/sherbivs/infinity-gauntlet.git
      - key: GITHUB_BRANCH
        value: data-cache
      - key: GITHUB_BASE_BRANCH
        value: main
      - key: CACHE_DIR
        value: /tmp/cache
      - key: GITHUB_TOKEN
        sync: false
