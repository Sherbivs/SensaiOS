services:
  - type: worker
    name: infinity-gauntlet-bots
    env: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    plan: free
    envVars:
      - key: SECURITY_BOT_TOKEN
        sync: false
      - key: POKEMON_BOT_TOKEN
        sync: false
      - key: ENABLE_POKEMON_BOT
        value: "true"
      - key: BATTLE_CHANNEL_NAME
        value: pokemon-battles
