services:
  - type: worker
    name: security-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false

  - type: worker
    name: pokemon-bot
    env: node
    buildCommand: cd discord-pokemon-bot && npm install
    startCommand: cd discord-pokemon-bot && npm start
    autoDeploy: true
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BATTLE_CHANNEL_NAME
        value: pokemon-battles
